# SPDX-License-Identifier: AGPL-3.0-only
# Sürüm: v* etiketi gönderilince Mac, Windows ve TV paketlerini derler ve GitHub sürümü olarak yayınlar.
# Beta etiketleri de (ör. v0.1.0-beta.6) "en son sürüm" olarak yayınlanır: README'deki
# releases/latest/download/… bağlantıları ön sürümleri görmez. Dosya adları sürüm taşımaz, bağlantılar hep çalışır.
#
# Mac imzası ve Apple onayı isteğe bağlıdır; şu depo sırları tanımlıysa yapılır:
#   MAC_CERTIFICATE_P12       Developer ID Application sertifikası (.p12, base64)
#   MAC_CERTIFICATE_PASSWORD  .p12 dosyasının parolası
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   notarytool için (uygulamaya özel parola)
# Sırlar yoksa Mac paketi imzasız çıkar.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # vernumsms fork'u: yalnız Windows (Samsung TV uygulaması içinde) ve TV paketleri. Mac ve Android TV paketleri
  # imza anahtarı istediği ve bu kurulumda gerekmediği için derlenmez.
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      with-android: false


  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketle
        run: |
          npm install -g @webos-tools/cli
          ./scripts/package-tv.sh
          ./scripts/package-tizen.sh
          # Masaüstü uygulamaları imzalar; elle kurmak isteyenler için kaynak klasör de verilir.
          rm -f dist/tv-app/couchsubs-samsung_*.wgt
          (cd dist/tv-tizen/app && zip -qr ../../tv-app/CouchSubs-samsung-kaynak.zip .)
          ls dist/tv-app
      - uses: actions/upload-artifact@v4
        with:
          name: couchsubs-tv
          path: dist/tv-app/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, tv]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Dosyaları hazırla
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          mkdir -p out
          cp LICENSE THIRD-PARTY-NOTICES.md artifacts/couchsubs-windows/
          # Sabit adlar: README'deki tek tıkla indirme bağlantıları her sürümde aynı kalır.
          (cd artifacts/couchsubs-windows && zip -qr "$GITHUB_WORKSPACE/out/CouchSubs-windows-x64.zip" .)
          cp artifacts/couchsubs-tv/* out/
          cp artifacts/couchsubs-windows-installer/* out/
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out

      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "CouchSubs ${GITHUB_REF_NAME#v}" \
            --notes-file docs/surum-notlari.md --latest
